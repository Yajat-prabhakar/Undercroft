# Only the gateway can talk to Ollama. Nothing else in the cluster (or outside it)
# gets direct access to the inference backend. This is the concrete artifact
# behind the "security" line on the resume bullet.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ollama-restrict-ingress
spec:
  podSelector:
    matchLabels:
      app: ollama
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: gateway
      ports:
        - port: 11434
